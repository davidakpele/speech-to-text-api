version: '3.8'

services:
  app:
    build: .
    ports:
      - "8001:8001" 
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///app.db
      - OLLAMA_MODEL=finalend/hermes-3-llama-3.1:8b
      - OLLAMA_HOST=ollama:11434
      - REDIS_URL=redis://redis:6379/0 
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - summaries:/app/summaries
    depends_on:
      - ollama
      - redis 
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - /c/Users/akpel/.ollama:/root/.ollama
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6380:6379"
    restart: always
  
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  uploads:
  outputs:
  summaries: