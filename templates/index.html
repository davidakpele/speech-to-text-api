{% extends "base.html" %}

{% block title %}
File Upload
{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6 text-gray-800">Upload a File</h1>

{% if error_message %}
<p class="text-red-500 mb-4">{{ error_message }}</p>
{% endif %}

<form action="/uploadfile/" method="post" enctype="multipart/form-data" class="space-y-4">
    <label for="file_upload" class="sr-only">Choose file</label>
    <input 
        type="file" 
        name="file" 
        id="file_upload" 
        class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
        required
    />
    <button 
        type="submit" 
        class="w-full px-4 py-2 text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
    >
        Upload
    </button>
</form>
{% endblock %}
