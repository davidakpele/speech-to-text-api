{% extends "base.html" %}

{% block title %}
Upload Successful
{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4 text-green-600">Upload Successful!</h1>
<p class="text-lg text-gray-700 mb-6">Your file, `{{ filename }}`, was uploaded successfully.</p>
<a 
    href="/" 
    class="inline-block px-6 py-2 text-white bg-blue-600 rounded-full hover:bg-blue-700 transition-colors"
>
    Upload another file
</a>
{% endblock %}
